<!DOCTYPE html>
<html>
<head>
  <title>Wingback — Get Your Flight Compensation</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: sans-serif; max-width: 500px; margin: 40px auto;">
  <h1>Wingback</h1>
  <p>Flight delayed or cancelled? Check what you're owed — free.</p>

  <form id="claimForm">
    <input id="name" placeholder="Full Name" required><br><br>
    <input id="email" placeholder="Email" required><br><br>
    <input id="phone" placeholder="Phone"><br><br>
    <input id="pnr" placeholder="PNR Number" required><br><br>
    <input id="flight" placeholder="Flight Number" required><br><br>
    <input id="airline" placeholder="Airline" required><br><br>
    <input id="date" type="date" required><br><br>
    <select id="event">
      <option value="delay">Delayed</option>
      <option value="cancellation">Cancelled</option>
      <option value="denied_boarding">Denied Boarding</option>
    </select><br><br>
    <input id="price" type="number" placeholder="Ticket Price (₹)" required><br><br>
    <button type="submit">Check My Compensation</button>
  </form>

  <div id="result" style="margin-top:20px; font-weight:bold;"></div>

  <script>
    const supabase = window.supabase.createClient(
      "https://qdaaampcezgqfzfjikin.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkYWFhbXBjZXpncWZ6Zmppa2luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzE2NTksImV4cCI6MjEwNTkwNzY1OX0.pEWzMyDZFgcHbUSw3_bOvXUKX6C4icD6-pjlt_VsNKA"
    );

    function checkEligibility(eventType, price) {
      if (eventType === "cancellation") {
        return { eligible: true, compensation: Math.min(Math.max(price * 0.5, 5000), 10000) };
      }
      if (eventType === "denied_boarding") {
        return { eligible: true, compensation: 20000 };
      }
      return { eligible: true, compensation: 0 };
    }

    document.getElementById("claimForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const eventType = document.getElementById("event").value;
      const price = parseFloat(document.getElementById("price").value);
      const result = checkEligibility(eventType, price);

      document.getElementById("result").innerText =
        result.compensation > 0
          ? `You may be eligible for ₹${result.compensation}. We'll take it from here.`
          : `You're eligible for meals/refund entitlements. We'll file this for you.`;

      await supabase.from("claims").insert({
        passenger_name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        pnr: document.getElementById("pnr").value,
        flight_no: document.getElementById("flight").value,
        airline: document.getElementById("airline").value,
        travel_date: document.getElementById("date").value,
        event_type: eventType,
        ticket_price: price,
        eligible: result.eligible,
        compensation: result.compensation,
        status: "new"
      });
    });
  </script>
</body>
</html>
